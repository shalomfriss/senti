[project]
name = "senti-news-engine"
version = "0.1.0"
description = "Stock-news sentiment engine and website"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "uvicorn>=0.35.0",
  "jinja2>=3.1.6",
  "vadersentiment>=3.3.2"
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "httpx>=0.28.1"
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senti"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
